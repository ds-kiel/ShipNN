gpu_id: '<gpu_id>' # GPU id to use. Use -1 for CPU.
workers: 8

seed: 42
output_dir: '<output_dir_path>' # Path to the folder where outputs will be saved.
resume: null # Checkpoint path

wandb:
  log: True # Whether to log the model to wandb.
  # If True, then set the following parameters.
  key: '<wandb key>' # Your wandb key.
  project: '<project name>'
  run_name: '<run_name>'
  id: null
  tags: null

model:
  name: '<model_name>' # Type of the model. Options are ["resnet18", "mobilenetv3"].
  width: 0.25
  num_classes: 100 # Number of predicted classes.

hyperparameters:
  dropout: 0.2
  epochs: 1
  learning_rate: 0.0005

dataset:
  augment: True
  augmentation_type: 'noise'
  root_dir: '<data_dir_path>' # Path to the dataset folder.
  batch_size: 32
  sample_rate: 16000 # Sample rate of the wav file.
  num_samples: 1
  preprocess: ["cqt","mfcc"] # preprocessing type. Options are ["cqt","mfcc","gamma"]. or [] for raw audio.
  FREQ_BINS : 95 # This number was based on the CQT, which have 95 freq bins for 4186hz
  HOP_LENGTH : 125 # Used to generate an output of 128 on x axis
  N_FFT : 16000 # This value is UNUSED because of the freq bins is mandatory
  FMAX : 4186 # Correspond to a C8 note (Most High on a piano) (empirical)
  FMIN : 18.0 # Minimun accepted value on CQT for audios of 1s
  N_MFCC : 13